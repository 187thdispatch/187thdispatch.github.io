(async function () {
  var note = document.getElementById("note");
  function bytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/").replace(/\s+/g, "");
    while (s.length % 4) s += "=";
    var b = atob(s), out = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
    return out;
  }
  try {
    var k = decodeURIComponent(location.hash.slice(1));
    if (!k || !window.crypto || !crypto.subtle) throw new Error("no key");
    var raw = bytes(document.getElementById("issue").textContent);
    var key = await crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, key, raw.slice(12));
    var html = new TextDecoder().decode(plain);
    var doc = new DOMParser().parseFromString(html, "text/html");      // the paper replaces this page
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
  } catch (e) {
    note.textContent = "This issue opens only from its link in the officers' channel on Discord.";
  }
})();
</script></body></html>
